name: Build Teleport SAML OSS Docker Image

on:
  push:
    branches:
      - feature/saml-oss
  workflow_dispatch:
    inputs:
      teleport_version:
        description: 'Teleport version tag (e.g. v18.6.8). Leave empty to auto-detect from branch.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/teleport-saml-oss

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Teleport version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.teleport_version }}" ]; then
            VERSION="${{ github.event.inputs.teleport_version }}"
          else
            # Extract version from the most recent upstream release tag in history
            VERSION=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "")
            if [ -z "$VERSION" ]; then
              # Fallback: parse from Makefile or version.go
              VERSION=$(grep -oP 'Version\s*=\s*"\K[^"]+' lib/utils/version.go 2>/dev/null | head -1)
              VERSION="v${VERSION}"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_short=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version_short }}
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.saml-oss
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TELEPORT_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
