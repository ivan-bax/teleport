name: Build Teleport SAML OSS

on:
  push:
    branches:
      - feature/saml-oss
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/teleport-saml-oss

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect Teleport version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "")
          if [ -z "$VERSION" ]; then
            RAW=$(grep -oP 'Version\s*=\s*"\K[^"]+' api/version.go 2>/dev/null | head -1)
            if [ -n "$RAW" ]; then
              VERSION="v${RAW}"
            fi
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "v" ]; then
            echo "ERROR: Could not detect Teleport version"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_short=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version_short }}
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.saml-oss
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Extract binaries from Docker image
        run: |
          docker create --name extract ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version_short }}
          mkdir -p dist
          for bin in teleport tctl tsh tbot; do
            docker cp extract:/usr/local/bin/$bin dist/$bin
          done
          docker rm extract
          cd dist
          tar czf teleport-saml-oss-${{ steps.version.outputs.version }}-linux-amd64.tar.gz teleport tctl tsh tbot
          sha256sum teleport-saml-oss-${{ steps.version.outputs.version }}-linux-amd64.tar.gz > checksums.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: saml-oss-${{ steps.version.outputs.version }}
          name: Teleport SAML OSS ${{ steps.version.outputs.version }}
          body: |
            Teleport ${{ steps.version.outputs.version }} with SAML authentication enabled for OSS.

            ## Install or upgrade
            ```bash
            curl -sL https://raw.githubusercontent.com/ivan-bax/teleport/feature/saml-oss/install-teleport-saml.sh | sudo bash
            ```

            ## Docker
            ```bash
            docker pull ghcr.io/ivan-bax/teleport-saml-oss:${{ steps.version.outputs.version_short }}
            ```

            ## Binaries
            - `teleport` — Main server
            - `tctl` — Admin CLI
            - `tsh` — User CLI
            - `tbot` — Machine ID bot
          files: |
            dist/teleport-saml-oss-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            dist/checksums.txt
          make_latest: true
